# Exudyn GitLab CI
#
# Purpose: keep the wheels and the test suite running while GitHub master is frozen at 1.11.0
# (revision plan decision D6, step 11). GitHub Actions only fire on pushes to master and on pull
# requests, so between now and the v2.0 release they never run. This covers the blind spot that
# matters most: Linux, which nobody builds by hand day to day.
#
# NOT covered here, deliberately - see revision plan step 11:
#   Windows  - this is the daily development machine, so breakage surfaces within hours anyway
#   macOS    - runs at milestones on a real Mac; macOS failures arrive coupled with Linux ones,
#              except visualization, which cannot be tested headlessly on any runner
#   aarch64  - GitLab's shared runners are x86_64 and QEMU would take hours; returns with
#              GitHub CI at release
#
# WHEN THIS RUNS: nothing is triggered by an ordinary push. Pipelines start from the weekly
# schedule (Settings -> CI/CD -> Schedules, target branch v2-dev), from the "Run pipeline"
# button, or from a tag. That cadence is a deliberate decision, not an oversight.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"          # the "Run pipeline" button
    - if: $CI_COMMIT_TAG

stages:
  - build
  - docs

# Build and test one manylinux wheel per Python version.
#
# The job image IS the manylinux image, so the build runs directly inside it: no
# docker-in-docker, no privileged runner. tools/ci/buildManylinux.sh is the same script the
# local docker path uses, so a failure here reproduces locally with one command.
wheels_linux:
  stage: build
  image: quay.io/pypa/manylinux_2_28_x86_64
  parallel:
    matrix:
      - PYTAG: [cp310, cp311, cp312, cp313, cp314]
  variables:
    # regular runs do not exercise the __FAST_EXUDYN_LINALG binary, and skipping it roughly
    # halves compile time; release builds must NOT set this
    EXUDYN_NOFAST: "1"
  script:
    - bash tools/ci/buildManylinux.sh "$PYTAG"
  artifacts:
    when: always                                # keep the logs from a failed run too
    paths:
      - dist/manylinux/*.whl
      - python/TestModels/testSuiteLog_V*.txt
    expire_in: 30 days
  # No allow_failure. The GitHub workflow sets continue-on-error: true, which combined with a
  # test suite that always exited 0 meant CI could not fail. runTestSuite.py --exit-code now
  # returns non-zero on reproducible failures, and this job is allowed to go red.

# Verify that the committed generated files still match what the generators produce
# (revision plan step 2). Tier 1 - the API surface - is a hard gate and fails this job;
# Tier 2 - documentation - warns only, because a change to a reference list or an item
# description legitimately moves the .rst files and blocking on that trains people to
# ignore the job.
#
# Needs numpy and NOTHING else. Verified 2026-09-11 by running the six generators in a
# venv containing only numpy: exudyn itself is NOT required, because every `import exudyn`
# in the generators sits inside a string literal being written out, not at module level.
# So this job does not need a built wheel and does not wait for one.
#
# It runs in the build stage, in parallel with wheels_linux rather than gating it: a
# generated-file drift and a broken build are independent failures and each is worth
# knowing about on its own.
#
# NOTE: this is the first time generation runs anywhere but Windows (revision plan
# fact 18). .gitattributes (step 70) normalises the checkout to LF and the generators now
# write UTF-8 explicitly (step 71), so it should be clean - but if the first runs show
# whole-file differences rather than real ones, suspect line endings before the generators.
regenerated_files:
  stage: build
  image: python:3.13
  variables:
    GIT_DEPTH: "1"                              # the tool only ever compares against HEAD
  before_script:
    # the checkout is owned by a different uid than the one the container runs as, and git
    # refuses to operate on it without this; the tool shells out to git rev-parse/status/show
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - pip install --no-cache-dir numpy
    - python tools/regenerate.py --check
  artifacts:
    when: on_failure                            # only interesting when it went red
    paths:
      - src/Autogenerated/
      - python/exudyn/itemInterface.py
    expire_in: 7 days

# Keep 'pip install exudyn[tests]' and '[all]' honest: the extras in pyproject.toml are
# compared against the imports that actually occur in the code (revision plan step 80). This is a
# pure AST scan - no build, no install, not even numpy - so it is cheap and independent of the
# wheels, which is why it sits in the same stage rather than after them.
check_extras:
  stage: build
  image: python:3.13                            # tomllib needs 3.11+
  variables:
    GIT_DEPTH: "1"
  before_script:
    # same uid mismatch as regenerated_files; the tool shells out to git rev-parse
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - python tools/checkExtras.py --check

# Documented arguments must match the signatures in python/exudyn (revision plan step 38). The
# configuration and the baseline of findings that existed when the check was introduced are in
# pyproject.toml [tool.pydoclint]; only new findings fail. A pure static scan, like check_extras.
check_docstrings:
  stage: build
  image: python:3.13
  variables:
    GIT_DEPTH: "1"
  script:
    - pip install --no-cache-dir pydoclint==0.9.1          # the baseline messages are version-specific
    - pydoclint --config=pyproject.toml python/exudyn

# Keep the compile list honest: sources.json is generated from the ClCompile entries of
# cppsrc.vcxproj, and setup.py builds from the JSON (revision plan step 17). This fails when the
# vcxproj, the JSON and the files on disk disagree - including on CASE, which is invisible on the
# Windows development machine and fatal here.
check_sources:
  stage: build
  image: python:3.13
  variables:
    GIT_DEPTH: "1"
  script:
    - python tools/gen_sources.py --check

# Catch documentation breakage during the freeze. This does NOT deploy: GitHub Pages correctly
# stays at 1.11.0 while the public release is 1.11.0.
docs:
  stage: docs
  image: python:3.13
  script:
    - pip install --no-cache-dir -r docs/requirements.txt
    - sphinx-build -b html . _build -E -W --keep-going
  artifacts:
    paths:
      - _build
    expire_in: 7 days
