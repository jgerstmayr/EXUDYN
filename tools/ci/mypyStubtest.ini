#mypy configuration used ONLY by 'python tools/checkPython.py --stubs'.
#stubtest compiles the package with mypy before it compares stub and module, and refuses to
#compare at all while that compile fails. The shipped package is untyped Python and produces
#several hundred mypy errors, none of which this check is about - so errors in the source are
#ignored here. This file says nothing about how users should type-check their own code.
[mypy]
ignore_errors = True
ignore_missing_imports = True
follow_imports = silent
