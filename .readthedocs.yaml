#+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# author: Johannes Gerstmayr; template used from readthedocs page
# data: 2023-10-25
# description: file used by readthedocs to compile github docu online
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - |
        if git diff --quiet HEAD~1 -- docs/ .readthedocs.yaml; then
          exit 183
        fi
    #the docs toolchain is the 'docs' dependency group in pyproject.toml (revision2026 step R4.24)
    install:
      - pip install --upgrade pip
      - pip install --group docs

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: conf.py

