name: Wheels

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:        # CHANGED: allow manual runs (useful before a release)

permissions:
  contents: read            # CHANGED: least-privilege default

jobs:

  build_wheels:
    name: cp3${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true   # keep: other wheels still get built
    strategy:
      fail-fast: false        # CHANGED: don't cancel siblings on first failure
      matrix:
        # os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
        # python-version: ['10', '11', '12', '13', '14']
        os: [macos-15]
        python-version: ['13']

    steps:
      - uses: actions/checkout@v6          # CHANGED: v4 -> v6

      # CHANGED: host Python is now fixed and independent of the target version.
      # cibuildwheel downloads the target interpreters itself, so there is no
      # reason to ask setup-python for e.g. 3.9/arm64 (which does not exist and
      # was silently breaking the macOS matrix once macos-latest became arm64).
      - name: Set up host Python
        uses: actions/setup-python@v6      # CHANGED: v4/v5 -> v6
        with:
          python-version: '3.13'

      # REMOVED: docker/setup-qemu-action - no longer needed, aarch64 wheels are
      # now built natively on ubuntu-24.04-arm (much faster, and the test suite
      # actually runs at native speed).

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==3.4.1"   # CHANGED: pinned

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse main
        env:
          CIBW_BUILD: "cp3${{ matrix.python-version }}-*"
          CIBW_SKIP: "*-win32 *-win_arm64 *musllinux*"
          CIBW_ARCHS: "auto64"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_TEST_SKIP: "*universal2:x86_64"   # x86_64 half can't run on arm64 runner          CIBW_BUILD_VERBOSITY: 1

          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y epel-release &&
            dnf install -y mesa-libGL-devel mesa-libGLU-devel glfw-devel freeglut-devel libX11-devel

          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"

          CIBW_TEST_REQUIRES: "numpy matplotlib scipy"
          CIBW_TEST_COMMAND_LINUX: "cd {project}/main/pythonDev/TestModels && python runTestSuite.py -quiet -local"
          # CIBW_TEST_COMMAND_MACOS: "cd {project}/main/pythonDev/TestModels && python runTestSuite.py -quiet -local"
          CIBW_TEST_COMMAND_MACOS: >-
            python -c "import matplotlib.pyplot" &&
            cd {project}/main/pythonDev/TestModels &&
            mkdir -p ../TestSuiteLogs &&
            PYTHONFAULTHANDLER=1 python -u -X faulthandler runTestSuite.py -local
          # CHECK again 2026-08-05: (was disabled before: strange exit code on Windows since 2024-10-09)
          CIBW_TEST_COMMAND_WINDOWS: "cd /d {project}/main/pythonDev/TestModels && python runTestSuite.py -quiet -local"

      - uses: actions/upload-artifact@v7    # CHANGED: v4 -> v7
        with:
          name: uploaddata-wheels-${{ matrix.os }}-cp3${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error          # CHANGED: fail loudly on empty upload

      - name: Upload tests
        uses: actions/upload-artifact@v7    # CHANGED: v4 -> v7
        if: always()                        # CHANGED: keep logs even if tests fail
        with:
          name: uploaddata-tests-${{ matrix.os }}-cp3${{ matrix.python-version }}
          path: main/pythonDev/TestModels/testSuiteLog_V*.txt
          if-no-files-found: ignore

  mergeArtifacts:
    needs: [build_wheels]                   # CHANGED: single build job now
    runs-on: ubuntu-24.04                   # CHANGED: pinned label
    steps:
      - name: Merge All Artifacts
        uses: actions/download-artifact@v6  # CHANGED: v4 -> v6
        with:
          path: merged-artifacts
          pattern: 'uploaddata-*'
          merge-multiple: true

      - name: Zip Merged Artifacts
        run: zip -r merged-wheels.zip merged-artifacts

      - name: Upload Merged ZIP Artifact
        uses: actions/upload-artifact@v7    # CHANGED: v4 -> v7
        with:
          name: merged-wheels
          path: merged-wheels.zip
