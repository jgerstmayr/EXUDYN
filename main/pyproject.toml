[build-system]
#setuptools>=61 is what makes the [project] table below authoritative; on anything older it is
#silently ignored and the wheel ends up with no metadata at all (revision plan step 14).
#pybind11<3.0: 3.0 (July 2025) is not yet compatible - a deliberate pin, not a stale one. It moved
#here from setup_requires in step 15; note that this is honoured under build isolation ('pip
#wheel .', 'python -m build') but NOT by a direct 'python setup.py bdist_wheel', where pybind11
#must already be installed - see docs/howTo/condaEnvironments.md.
requires = ["setuptools>=61", "wheel", "pybind11<3.0"]
build-backend = "setuptools.build_meta"

#Static package metadata. Everything here used to be keyword arguments to setup(); what is left
#in setup.py is what genuinely depends on the build (version, packages, package_data,
#ext_modules, cmdclass). See revision plan step 14.
[project]
name = "exudyn"
description = "EXUDYN flexible multibody dynamics simulation in C++ and Python"
#the minimum Python version needed by THIS exudyn version, not the versions that are tested -
#pypi.org uses it to pick which wheel to offer, so a too-high bound hides the package.
#3.10 is the real floor since revision plan step 19: CI builds cp310-cp314, the classifiers say
#3.10-3.14, and the last artefact of 3.7 support (the ReleaseP37 configuration) is gone. ">=3.6"
#claimed wheels that have not existed for years; pip then offered an old release to a 3.6 user
#instead of telling them the truth.
requires-python = ">=3.10"
dependencies = ["numpy"]
#numpy is the only mandatory dependency and stays that way (CLAUDE.md, invariant)

#derived from the version string in setup.py: '.dev1' switches the Development Status classifier
dynamic = ["version", "classifiers"]

#a table, not an SPDX expression: the licence is the custom 'EXUDYN General License', not any
#OSI-approved BSD, so "BSD-3-Clause" would be a false claim. The corresponding
#'License :: OSI Approved :: BSD License' classifier was already dropped as deprecated.
license = { text = "BSD" }

[[project.authors]]
name = "Johannes Gerstmayr"
email = "reply.exudyn@gmail.com"

[project.urls]
Homepage = "https://github.com/jgerstmayr/EXUDYN"

#text/x-rst, shown as the project page on pypi.org. Inline rather than a file because README.md
#is markdown and is aimed at the repository, not at pypi.
[project.readme]
content-type = "text/x-rst"
text = """
==========
**Exudyn**
==========

A flexible multibody dynamics systems simulation code with Python and C++

Exudyn is hosted on `Github <https://github.com/jgerstmayr/EXUDYN>`_ which provides full documentation, tutorial, examples, etc.

See `License on github <https://github.com/jgerstmayr/EXUDYN/blob/master/LICENSE.txt>`_ .
Pre-compiled wheels available on PyPI via pip install.

For more information, installation and tutorials see:

https://github.com/jgerstmayr/EXUDYN

For CHANGES (section Issues and Bugs), detailed DOCUMENTATION on theory, usage, and REFERENCE MANUAL on **600+** pages:

https://github.com/jgerstmayr/EXUDYN/tree/master/docs/theDoc/theDoc.pdf

"""

#Optional dependency groups, checked against the imports actually present in the code by
#'python tools/checkExtras.py' (revision plan step 80) - so these lists cannot quietly go stale.
#  pip install exudyn[tests]   everything TestModels/ needs to run the test suite
#  pip install exudyn[all]     the above plus everything the package and the Examples refer to
#  pip install exudyn[rl]      reinforcement learning; deliberately NOT part of [all], see below
[project.optional-dependencies]
tests = [
    "scipy",
    "matplotlib",
    "h5py",
    "networkx",
    "psutil",
    "ngsolve",          #also provides the 'netgen' import used by the NGsolve tests
    ]
all = [
    "exudyn[tests]",    #PEP 508 self-reference: [all] is a superset of [tests] by construction
    "numpy-stl",        #imported as 'stl'
    "tqdm",
    "pymeshlab",
    "roboticstoolbox-python",
    "spatialmath-python",
    "ffmpeg-python",
    "numba",
    "dispy",
    "mpi4py",
    ]
#torch is multi-GB and the CPU/CUDA choice is made with an --index-url, which cannot be expressed
#in wheel metadata - so this stays opt-in and is NOT pulled in by [all]. The consequence is
#recorded rather than hidden: exudyn/artificialIntelligence.py imports stable_baselines3 at module
#level with no guard, so TestModels/allExudynModulesTest.py skips its RL part in a plain [tests]
#environment.
rl = [
    "torch",
    "stable-baselines3",
    "gymnasium",
    "gym",
    "tensorboard",
    ]

[tool.setuptools]
zip-safe = false
platforms = ["any"] #2022-03-20: used in numpy - may improve behavior in pypi.org?
